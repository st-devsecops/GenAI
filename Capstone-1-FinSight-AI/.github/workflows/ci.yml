  #   2. ingests data/sample
  #   3. runs `python -m evaluation.run_eval --min-hit-rate <x> --min-accuracy <y>` so a prompt or
  #      retrieval change that lowers quality FAILS the pipeline
  #   4. uploads reports/ as a build artifact
