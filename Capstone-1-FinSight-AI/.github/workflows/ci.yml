# Free on GitHub Actions for public repos (2,000 min/month on private free accounts).
name: ci

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: pytest   # fake LLMs - fast, deterministic, no model download
        # The original project repo only holds the TODOs, so its tests are expected to fail; your copy runs them.
        if: github.repository != 'Skillfyme-R/GenAI-CapStone-Project'

  # [W3] TODO - add an `eval-gate` job (needs: lint-test) that:
