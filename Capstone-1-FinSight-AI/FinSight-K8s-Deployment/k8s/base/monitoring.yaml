apiVersion: v1
kind: ConfigMap
metadata:
  name: finsight-prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
      - job_name: finsight-api
        metrics_path: /metrics
        static_configs:
          - targets: ["finsight-api:8000"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finsight-prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: finsight-prometheus
  template:
    metadata:
      labels:
        app: finsight-prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --web.enable-lifecycle
          ports:
            - name: http
              containerPort: 9090
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: finsight-prometheus-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: finsight-prometheus
spec:
  type: ClusterIP
  selector:
    app: finsight-prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: finsight-grafana-provisioning
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://finsight-prometheus:9090
        isDefault: true
        editable: false
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: finsight
        orgId: 1
        folder: FinSight AI
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
  finsight-overview.json: |
    {"uid":"finsight-overview","title":"FinSight AI - Runtime Overview","schemaVersion":39,"version":1,"refresh":"30s","panels":[{"id":1,"type":"stat","title":"API scrape status","gridPos":{"h":5,"w":6,"x":0,"y":0},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"up{job=\"finsight-api\"}","refId":"A"}]},{"id":2,"type":"timeseries","title":"Process resident memory (bytes)","gridPos":{"h":8,"w":12,"x":6,"y":0},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"process_resident_memory_bytes","refId":"A"}]},{"id":3,"type":"timeseries","title":"Process CPU time (seconds)","gridPos":{"h":8,"w":12,"x":0,"y":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"rate(process_cpu_seconds_total[5m])","refId":"A"}]}]}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finsight-grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: finsight-grafana
  template:
    metadata:
      labels:
        app: finsight-grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:12.1.0
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: finsight-grafana-secret
                  key: admin-password
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasource.yml
              subPath: datasource.yml
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml
              subPath: dashboards.yml
            - name: provisioning
              mountPath: /var/lib/grafana/dashboards/finsight-overview.json
              subPath: finsight-overview.json
      volumes:
        - name: provisioning
          configMap:
            name: finsight-grafana-provisioning
---
apiVersion: v1
kind: Service
metadata:
  name: finsight-grafana
spec:
  type: NodePort
  selector:
    app: finsight-grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30300
