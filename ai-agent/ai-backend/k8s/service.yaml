# Internal ClusterIP service for the SRE AI Agent.
# APISIX/Ingress can expose this service externally later.

apiVersion: v1
kind: Service

metadata:
  name: sre-ai-agent
  namespace: sre-ai

spec:

  type: ClusterIP

  selector:
    app: sre-ai-agent

  ports:

    - name: http
      port: 8080
      targetPort: http