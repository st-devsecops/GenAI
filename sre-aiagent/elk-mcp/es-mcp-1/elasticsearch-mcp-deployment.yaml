apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch-mcp
  namespace: es-mcp
  labels:
    app: elasticsearch-mcp
spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: elasticsearch-mcp

  template:
    metadata:
      labels:
        app: elasticsearch-mcp

    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: elasticsearch-mcp
          image: xxxx/tfs-docker/es-mcp:0.0.20

          imagePullPolicy: IfNotPresent

          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          env:
            - name: MAX_TIME_RANGE_HOURS
              value: "720"

            - name: ELASTICSEARCH_URL
              value: "https://tfs-elasticsearch-eck-elasticsearch-es-http.tfs-elasticsearch.svc:9200"

            - name: ELASTICSEARCH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-mcp-es-auth
                  key: ELASTICSEARCH_API_KEY

          volumeMounts:
            - name: elasticsearch-ca
              mountPath: /etc/elasticsearch-ca
              readOnly: true

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3

      volumes:
        - name: elasticsearch-ca
          secret:
            secretName: elasticsearch-mcp-es-ca
            defaultMode: 0444
